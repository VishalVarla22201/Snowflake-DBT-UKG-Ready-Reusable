snapshots:
  - name: scd__ukg_ready__compensation_history
    description: SCD type 2 history of compensation records (one row per record version).
    relation: ref('stg__ukg_ready__compensation_history')
    config:
      unique_key: compensation_history_key
      strategy: timestamp
      updated_at: _fivetran_synced
      hard_deletes: invalidate
      dbt_valid_to_current: "to_date('9999-12-31')"
    columns:
      - name: dbt_scd_id
        description: Surrogate key of the compensation record version.
        data_tests: [unique, not_null]
