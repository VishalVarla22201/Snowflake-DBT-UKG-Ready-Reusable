snapshots:
  - name: scd__ukg_ready__employee_details
    description: SCD type 2 history of the employee to job/store cost-center assignment.
    relation: ref('stg__ukg_ready__employee_details')
    config:
      unique_key: employee_key
      strategy: timestamp
      updated_at: _fivetran_synced
      hard_deletes: invalidate
      dbt_valid_to_current: "to_date('9999-12-31')"
    columns:
      - name: dbt_scd_id
        description: Surrogate key of the assignment version.
        data_tests: [unique, not_null]
