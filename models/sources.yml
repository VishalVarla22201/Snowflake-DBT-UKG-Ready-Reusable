version: 2

sources:
  - name: ukg_ready
    description: Raw UKG Ready extracts landed in Snowflake.
    database: fivetrandb
    schema: ukg_ready
    tables:
      - name: COMPENSATION_HISTORY
      - name: COST_CENTERS_ORG
      - name: COST_CENTERS_STORE
      - name: EMPLOYEE_DETAILS
      - name: EMPLOYEES
      - name: LOOKUP_EINS
      - name: TIME_ENTRIES

  - name: manual
    description: Manually maintained mapping tables feeding the gold mapping dimensions.
    database: "{{ var('mapping_database') }}"
    schema: manual
    tables:
      - name: department_mapping
      - name: hr_location_mapping
      - name: subsidiary_mapping
