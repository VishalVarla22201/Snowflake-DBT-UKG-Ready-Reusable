version: 2

models:
  - name: dim_hr_company
    columns:
      - name: company_key
        data_tests: [unique, not_null]

  - name: dim_hr_department
    columns:
      - name: department_key
        data_tests: [unique, not_null]

  - name: dim_hr_location
    columns:
      - name: location_key
        data_tests: [unique, not_null]

  - name: dim_job
    columns:
      - name: job_key
        data_tests: [unique, not_null]

  - name: dim_salary_code
    columns:
      - name: earning_key
        data_tests: [unique, not_null]

  - name: dim_hr_employee
    columns:
      - name: employee_key
        data_tests: [unique, not_null]
      - name: company_key
        data_tests:
          - relationships:
              to: ref('dim_hr_company')
              field: company_key
              config: {severity: warn}
      - name: location_key
      - name: job_key
      - name: department_key

  - name: dim_department_mapping
    columns:
      - name: department_mapping_key
        data_tests: [not_null]

  - name: dim_location_mapping
    columns:
      - name: location_mapping_key
        data_tests: [not_null]

  - name: dim_subsidiary_mapping
    columns:
      - name: subsidiary_mapping_key
        data_tests: [not_null]

  - name: fact_payroll_workhours
    columns:
      - name: payroll_workhours_key
        data_tests: [unique, not_null]
      - name: employee_key

  - name: fact_employee_salary_details
    columns:
      - name: employee_salary_detail_key
        data_tests: [unique, not_null]
      - name: payroll_workhours_key
        data_tests:
          - relationships:
              to: ref('fact_payroll_workhours')
              field: payroll_workhours_key
      - name: earning_key
        data_tests:
          - relationships:
              to: ref('dim_salary_code')
              field: earning_key
