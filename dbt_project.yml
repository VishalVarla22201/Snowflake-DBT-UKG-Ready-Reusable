name: 'ukg_ready'
version: '1.0.0'
config-version: 2

profile: 'ukg_ready'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Raw UKG Ready landing tables (source 'ukg_ready')
  raw_database: wagway_raw
  raw_schema: ukg_ready
  # Database holding the 'manual' schema with hand-maintained mapping tables (source 'manual')
  mapping_database: wagway_dev

models:
  ukg_ready:
    +materialized: table
    silver:
      +schema: SILVER
      +tags: ['silver', 'ukg_ready']
    gold:
      +schema: GOLD
      +tags: ['gold', 'ukg_ready']
